<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datastory Iconfont Preview</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://mtrcdn.datastory.com.cn/slibs/fonts/ds-iconf/iconfont.css">
  <link rel="stylesheet" href="https://mtrcdn.datastory.com.cn/slibs/fonts/ds-icon/iconfont.css">
  <link rel="stylesheet" href="https://at.alicdn.com/t/c/font_5013968_agndmh914i.css?spm=a313x.manage_type_myprojects.i1.12.23e73a81d1GYXS&file=font_5013968_agndmh914i.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #182235;
      --muted: #667085;
      --line: #d9e0ea;
      --brand: #1f5eff;
      --radius: 8px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
    aside { position: sticky; top: 0; height: 100vh; padding: 24px 20px; border-right: 1px solid var(--line); background: #fff; overflow: auto; }
    main { padding: 24px 28px 48px; min-width: 0; }
    h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.2; letter-spacing: 0; }
    .meta { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .search-wrap { margin-bottom: 16px; }
    input[type="search"] { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: var(--radius); padding: 0 12px; color: var(--text); background: #fff; outline: none; font-size: 14px; }
    input[type="search"]:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(31, 94, 255, .12); }
    .controls { display: grid; gap: 12px; margin-bottom: 20px; }
    .control-label { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; }
    input[type="range"] { width: 100%; }
    .tabs { display: grid; gap: 8px; margin: 18px 0 20px; }
    .tab { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; background: #fff; text-align: left; cursor: pointer; color: var(--text); font-size: 13px; }
    .tab.active { border-color: var(--brand); background: #eef4ff; color: #123fba; }
    .source-list { display: grid; gap: 10px; font-size: 12px; line-height: 1.5; }
    .source-list a { overflow-wrap: anywhere; color: #155eef; text-decoration: none; }
    .topbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .summary { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
    .pill { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
    .section { margin-bottom: 28px; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h2 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .count { color: var(--muted); font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 10px; }
    .icon-card { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 14px 12px 12px; cursor: pointer; transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease; text-align: left; }
    .icon-card:hover { transform: translateY(-1px); border-color: #a7b4c8; box-shadow: 0 8px 20px rgba(17, 24, 39, .08); }
    .icon-glyph { height: 48px; display: flex; align-items: center; color: var(--card-accent); font-size: var(--icon-size); line-height: 1; }
    .icon-glyph i { font-size: inherit; }
    .icon-name { margin-top: 10px; color: var(--text); font-size: 12px; line-height: 1.35; overflow-wrap: anywhere; }
    .icon-code { margin-top: 4px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .empty { display: none; padding: 48px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); background: #fff; }
    .toast { position: fixed; right: 20px; bottom: 20px; transform: translateY(20px); opacity: 0; pointer-events: none; border-radius: var(--radius); background: #101828; color: #fff; padding: 10px 14px; font-size: 13px; transition: opacity .16s ease, transform .16s ease; max-width: min(360px, calc(100vw - 40px)); }
    .toast.show { transform: translateY(0); opacity: 1; }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 18px 14px 36px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1>Iconfont Preview</h1>
      <p class="meta">图标加载中<br>生成时间：获取中</p>
      <div class="search-wrap"><input id="search" type="search" placeholder="搜索类名或编码" autocomplete="off"></div>
      <div class="controls"><label><span class="control-label"><span>图标大小</span><span id="sizeValue">28px</span></span><input id="size" type="range" min="18" max="52" value="28"></label></div>
      <div class="tabs" id="tabs"></div>
      <div class="source-list"><a href="https://mtrcdn.datastory.com.cn/slibs/fonts/ds-iconf/iconfont.css" target="_blank" rel="noreferrer">https://at.alicdn.com/t/c/font_5013968_agndmh914i.css?spm=a313x.manage_type_myprojects.i1.12.23e73a81d1GYXS&file=font_5013968_agndmh914i.css</a></div>
    </aside>
    <main>
      <div class="topbar"><div class="summary" id="summary"></div></div>
      <div id="content"></div>
      <div class="empty" id="empty">没有匹配的图标</div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    let groups = [
      {
            "title": "Gloda AI Marketer / iconfont",
            "url": "https://at.alicdn.com/t/c/font_5013968_agndmh914i.css?spm=a313x.manage_type_myprojects.i1.12.23e73a81d1GYXS&file=font_5013968_agndmh914i.css",
            "baseClass": "iconfont",
            "accent": "#c2410c",
            "icons": []
      },
      {
            "title": "ds-iconf / dsiconfont",
            "url": "https://mtrcdn.datastory.com.cn/slibs/fonts/ds-iconf/iconfont.css",
            "baseClass": "dsiconfont",
            "accent": "#2563eb",
            "icons": []
      },
      {
            "title": "ds-icon",
            "url": "https://mtrcdn.datastory.com.cn/slibs/fonts/ds-icon/iconfont.css",
            "baseClass": "ds-icon",
            "accent": "#0f766e",
            "icons": []
      }
];
    const state = { active: 'all', query: '', size: 28 };
    const tabs = document.getElementById('tabs');
    const content = document.getElementById('content');
    const empty = document.getElementById('empty');
    const summary = document.getElementById('summary');
    const search = document.getElementById('search');
    const size = document.getElementById('size');
    const sizeValue = document.getElementById('sizeValue');
    const toast = document.getElementById('toast');
    const meta = document.querySelector('.meta');
    const generatedAt = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '/');
    let toastTimer;
    function parseIconCss(css) {
      const icons = [];
      const pattern = /\.([\w-]+):before\s*\{\s*content:\s*["']\\([0-9a-fA-F]+)["']\s*;?\s*\}/g;
      let match;
      while ((match = pattern.exec(css))) icons.push({ className: match[1], code: '\\' + match[2] });
      return icons.sort((a, b) => a.className.localeCompare(b.className, 'en'));
    }
    async function syncGroupsFromCss() {
      const nextGroups = await Promise.all(groups.map(async (group) => {
        try {
          const response = await fetch(group.url, { cache: 'no-cache' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const icons = parseIconCss(await response.text());
          return icons.length ? { ...group, icons } : group;
        } catch (error) {
          console.warn('Iconfont CSS 加载失败:', group.url, error);
          return group;
        }
      }));
      groups = nextGroups;
      const total = groups.reduce((sum, group) => sum + group.icons.length, 0);
      meta.innerHTML = '共 ' + total + ' 个图标<br>生成时间：' + generatedAt;
      render();
    }
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
      const textarea = document.createElement('textarea'); textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0'; document.body.appendChild(textarea); textarea.select(); document.execCommand('copy'); textarea.remove(); return Promise.resolve();
    }
    function showToast(text) { toast.textContent = text; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1400); }
    function makeTab(id, label, count) { const button = document.createElement('button'); button.className = 'tab' + (state.active === id ? ' active' : ''); button.type = 'button'; button.textContent = label + ' (' + count + ')'; button.addEventListener('click', () => { state.active = id; render(); }); return button; }
    function iconMatches(icon) { if (!state.query) return true; const q = state.query.toLowerCase(); return icon.className.toLowerCase().includes(q) || icon.code.toLowerCase().includes(q); }
    function renderTabs() { tabs.innerHTML = ''; tabs.appendChild(makeTab('all', '全部', groups.reduce((sum, group) => sum + group.icons.length, 0))); groups.forEach((group, index) => tabs.appendChild(makeTab(String(index), group.title, group.icons.length))); }
    function render() {
      document.documentElement.style.setProperty('--icon-size', state.size + 'px'); sizeValue.textContent = state.size + 'px'; renderTabs(); content.innerHTML = '';
      const visibleGroups = state.active === 'all' ? groups : [groups[Number(state.active)]]; let shown = 0;
      visibleGroups.forEach((group) => { const icons = group.icons.filter(iconMatches); shown += icons.length; if (!icons.length) return; const section = document.createElement('section'); section.className = 'section'; const head = document.createElement('div'); head.className = 'section-head'; head.innerHTML = '<h2>' + group.title + '</h2><span class="count">' + icons.length + ' / ' + group.icons.length + '</span>'; const grid = document.createElement('div'); grid.className = 'grid'; icons.forEach((icon) => { const card = document.createElement('button'); card.type = 'button'; card.className = 'icon-card'; card.style.setProperty('--card-accent', group.accent); card.title = '点击复制：' + icon.className; card.innerHTML = '<div class="icon-glyph"><i class="' + group.baseClass + ' ' + icon.className + '"></i></div><div class="icon-name">' + icon.className + '</div><div class="icon-code">' + icon.code + '</div>'; card.addEventListener('click', async () => { const text = icon.className; await copyText(text); showToast('已复制：' + text); }); grid.appendChild(card); }); section.appendChild(head); section.appendChild(grid); content.appendChild(section); });
      summary.innerHTML = '<span class="pill">当前显示 ' + shown + ' 个</span><span class="pill">点击图标卡片复制图标 class</span>'; empty.style.display = shown ? 'none' : 'block';
    }
    search.addEventListener('input', (event) => { state.query = event.target.value.trim(); render(); });
    size.addEventListener('input', (event) => { state.size = Number(event.target.value); render(); });
    render();
    syncGroupsFromCss();
  </script>
</body>
</html>
